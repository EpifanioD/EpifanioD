<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-size="15" role="img" aria-labelledby="title desc"><title id="title">Software architecture</title><desc id="desc">Layered diagram: SPA · Mobile → REST API → Application → Domain → Data → Events. Styles: Modular Monolith, Microservices, Serverless, Event-Driven. Principles: Clean Architecture, SOLID, Design Patterns, Domain-Driven Design.</desc><style>
